name: Build OBS Plugin

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simplevoicechat-obs-${{ github.ref }}
  cancel-in-progress: true

env:
  # OBS Studio 32.0.4. Keep this ABI pin aligned with the published package.
  OBS_REF: dcdbd2e9048ae66237fdab32dbba72b745b1b9c5
  BUILD_CONFIG: Release

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Check out OBS Studio
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: ${{ env.OBS_REF }}
          path: obs-studio
          submodules: recursive
          fetch-depth: 0

      - name: Add plugin to OBS build
        shell: pwsh
        run: |
          Copy-Item -LiteralPath ObsPlugin -Destination obs-studio/plugins/simplevoicechat-obs -Recurse
          Add-Content -LiteralPath obs-studio/plugins/CMakeLists.txt -Value "`nadd_obs_plugin(simplevoicechat-obs)`n"

      - name: Build against OBS Studio
        uses: ./obs-studio/.github/actions/build-obs
        with:
          target: x64
          config: ${{ env.BUILD_CONFIG }}
          workingDirectory: ${{ github.workspace }}/obs-studio

      - name: Package plugin
        id: package
        shell: pwsh
        run: |
          $Version = (Get-Content -LiteralPath modinfo.json -Raw | ConvertFrom-Json).version
          $Stage = Join-Path $PWD artifacts/windows
          $Plugin = Get-ChildItem -LiteralPath obs-studio/build_x64/install -Recurse -File -Filter simplevoicechat_obs.dll | Select-Object -First 1
          if ($null -eq $Plugin) { throw 'simplevoicechat_obs.dll was not installed by the OBS build' }

          New-Item -ItemType Directory -Force -Path "$Stage/obs-plugins/64bit" | Out-Null
          Copy-Item -LiteralPath $Plugin.FullName -Destination "$Stage/obs-plugins/64bit/simplevoicechat_obs.dll"
          $Package = Join-Path $PWD "artifacts/simplevoicechat_obs_plugin_${Version}_windows_x64.zip"
          Compress-Archive -Path "$Stage/*" -DestinationPath $Package -CompressionLevel Optimal -Force
          "package=$Package" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: simplevoicechat-obs-plugin-windows-x64
          path: ${{ steps.package.outputs.package }}
          if-no-files-found: error
